spring:
  application:
    name: backend
  config:
    import: optional:classpath:application-secret.yml

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 604800000
  refresh-token-expiration: 604800000

file:
  upload-dir: uploads/profile-images
  static-resource-dir: uploads

dem:
  file-path: ${DEM_FILE_PATH:}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

hiking:
  trail-guard:
    enabled: true

summit:
  photo-upload-dir: uploads/summit-photos