spring:
  application:
    name: backend
  profiles:
    include: secret

  datasource:
    url: jdbc:postgresql://localhost:5432/orda
    username: postgres
    password: "0000"
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080

jwt:
  secret: 'orda-secret-key-must-be-at-least-32-characters-long'
  access-token-expiration: 1800000
  refresh-token-expiration: 604800000

file:
  upload-dir: uploads/profile-images
  static-resource-dir: uploads

dem:
  file-path: ${DEM_FILE_PATH:}

kakao:
  client-id: ${KAKAO_CLIENT_ID:}
  redirect-uri: ${KAKAO_REDIRECT_URI:}

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4o-mini

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

hiking:
  trail-guard:
    enabled: true

summit:
  photo-upload-dir: uploads/summit-photos